syntax = "proto3";

package wiki_updates;

option go_package = "wiki_updates/models/pb";

// Update is a record on the updates topic.
message Update {
  string uri = 1;
  bool bot = 2;
  string user = 3;
  string meta_uri = 4;
}

// User is a record on the (compacted) users topic.
// The plain password is never stored.
message User {
  string email = 1;
  string password_hash = 2;
}

// StatsSnapshot is a record on the (compacted) snapshot topic.
message StatsSnapshot {
  int64 messages = 1;
  repeated string urls = 2;
  repeated string bots = 3;
  repeated string non_bots = 4;
  int64 offset = 5;
}
