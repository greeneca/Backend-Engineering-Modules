services:
  producer:
    image: wiki_producer
    container_name: producer
    pull_policy: build
    build:
      context: .
      dockerfile: ./Dockerfile-producer
    depends_on:
      redpanda-0:
        condition: service_healthy
    networks:
      - wiki

  consumer:
    image: wiki_consumer
    container_name: consumer
    pull_policy: build
    build:
      context: .
      dockerfile: ./Dockerfile-consumer
    ports:
      - "80:80"
    environment:
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      redpanda-0:
        condition: service_healthy
    networks:
      - wiki

  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.2
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    ports:
      - "19092:19092"
    networks:
      - wiki

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.0
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
          protobuf:
            enabled: true
            mappings:
              - topicName: wiki.updates
                valueProtoType: wiki_updates.Update
              - topicName: wiki.users
                valueProtoType: wiki_updates.User
              - topicName: wiki.stats.snapshot
                valueProtoType: wiki_updates.StatsSnapshot
            fileSystem:
              enabled: true
              paths: ["/etc/console/proto"]
              refreshInterval: 5m
    volumes:
      - ./proto:/etc/console/proto:ro
    ports:
      - "8080:8080"
    depends_on:
      redpanda-0:
        condition: service_healthy
    networks:
      - wiki

  database:
    image: cassandra:latest
    container_name: database
    profiles:
      - cassandra
    environment:
      - CASSANDRA_BROADCAST_ADDRESS=database
    healthcheck:
        test: ["CMD-SHELL", "nodetool status"]
        interval: 30s
        timeout: 10s
        retries: 5
    volumes:
      - ./database-data:/var/lib/cassandra
    networks:
      - wiki

  database-init:
    image: cassandra:latest
    profiles:
      - cassandra
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/init.sh", "database"]
    volumes:
      - ./data/scripts/init.sh:/init.sh
    networks:
      - wiki

volumes:
  redpanda-0: null

networks:
  wiki:
    driver: bridge
